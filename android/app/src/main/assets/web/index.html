<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小天才AI助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f0f2f5;--card:#fff;--text:#1a1a1a;--text2:#666;--text3:#999;
  --primary:#1976d2;--primary-light:#e3f2fd;--primary-dark:#1565c0;
  --green:#4caf50;--red:#f44336;--orange:#ff9800;
  --border:#e8e8e8;--shadow:0 2px 12px rgba(0,0,0,0.08);
  --radius:12px;--max-w:600px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.container{max-width:var(--max-w);margin:0 auto;padding:16px}

/* Header */
.header{background:var(--primary);color:#fff;padding:20px 16px 16px;border-radius:0 0 20px 20px;margin:-16px -16px 16px;position:sticky;top:0;z-index:100}
.header h1{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}
.header h1 span{font-size:24px}
.header .subtitle{font-size:12px;opacity:0.8;margin-top:4px}
.header .status-bar{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.status-tag{font-size:11px;padding:3px 8px;border-radius:20px;display:flex;align-items:center;gap:4px}
.status-tag .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.status-ok{background:rgba(76,175,80,0.2);color:#c8e6c9}
.status-ok .dot{background:#4caf50}
.status-warn{background:rgba(255,152,0,0.2);color:#ffe0b2}
.status-warn .dot{background:#ff9800}
.status-err{background:rgba(244,67,54,0.2);color:#ffcdd2}
.status-err .dot{background:#f44336}

/* Cards */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.card-title .icon{font-size:16px}

/* API Config */
.api-section{margin-bottom:12px;padding:12px;background:#fafafa;border-radius:8px;border:1px solid var(--border)}
.api-label{font-size:12px;font-weight:600;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:4px}
.api-label .badge{background:var(--primary);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px}
.api-label .badge.backup{background:var(--orange)}

/* Form */
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);
  border-radius:8px;font-size:14px;background:#fff;color:var(--text);transition:border-color 0.2s;outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:60px}

/* Chat */
.chat-box{background:#f8f9fa;border-radius:var(--radius);border:1px solid var(--border);max-height:400px;overflow-y:auto;padding:12px;margin-bottom:12px;min-height:200px}
.msg{margin-bottom:10px;display:flex;gap:8px;animation:fadeIn 0.3s ease}
.msg.user{flex-direction:row-reverse}
.msg .bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;word-break:break-word}
.msg.user .bubble{background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.msg.ai .bubble{background:#fff;color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.system .bubble{background:var(--primary-light);color:var(--primary);font-size:12px;text-align:center;width:100%}
.msg .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.msg.user .avatar{background:var(--primary-light)}
.msg.ai .avatar{background:#e8f5e9}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.typing{display:flex;gap:4px;padding:8px 14px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text3);animation:typing 1.4s infinite}
.typing span:nth-child(2){animation-delay:0.2s}
.typing span:nth-child(3){animation-delay:0.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* Input Area */
.input-area{display:flex;gap:8px;align-items:flex-end}
.input-area textarea{flex:1;padding:10px 12px;border:1px solid var(--border);border-radius:20px;font-size:14px;
  resize:none;max-height:100px;outline:none;min-height:42px;line-height:1.4;font-family:inherit}
.input-area textarea:focus{border-color:var(--primary)}
.btn{padding:10px 20px;border:none;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;
  transition:all 0.2s;display:flex;align-items:center;gap:4px;white-space:nowrap}
.btn:active{transform:scale(0.95)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{background:#bbb;cursor:not-allowed}
.btn-green{background:var(--green);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-outline{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn-block{width:100%;justify-content:center}

/* Quick actions */
.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.quick-actions .btn{font-size:12px;padding:6px 12px;border-radius:16px;background:var(--primary-light);color:var(--primary);border:none}

/* Settings toggle */
.settings-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:12px 0;border-bottom:1px solid var(--border)}
.settings-toggle:last-child{border-bottom:none}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;
  padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}

/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{flex:1;text-align:center;padding:10px;font-size:14px;font-weight:500;color:var(--text3);cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-2px;transition:all 0.2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Log */
.log-box{background:#1e1e1e;border-radius:8px;padding:12px;max-height:300px;overflow-y:auto;font-family:"Fira Code",monospace}
.log-box .log-line{font-size:11px;line-height:1.6;color:#d4d4d4;word-break:break-all}
.log-box .log-line.info{color:#569cd6}
.log-box .log-line.success{color:#4ec9b0}
.log-box .log-line.error{color:#f44747}
.log-box .log-line.warn{color:#ce9178}
</style>
</head>
<body>
<div class="container" id="app">
  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Header -->
  <div class="header">
    <h1><span>⌚</span> 小天才AI助手</h1>
    <div class="subtitle">本地AI → 自动发送到手表微聊</div>
    <div class="status-bar">
      <span class="status-tag" id="st-acc"><span class="dot"></span>无障碍</span>
      <span class="status-tag" id="st-ntf"><span class="dot"></span>通知</span>
      <span class="status-tag" id="st-xtc"><span class="dot"></span>小天才</span>
      <span class="status-tag" id="st-api"><span class="dot"></span>AI API</span>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" data-tab="chat">💬 对话</div>
    <div class="tab" data-tab="settings">⚙️ 设置</div>
    <div class="tab" data-tab="log">📋 日志</div>
  </div>

  <!-- Chat Tab -->
  <div class="tab-content active" id="tab-chat">
    <div class="card">
      <div class="card-title"><span class="icon">🎯</span>快捷指令</div>
      <div class="quick-actions">
        <button class="btn" onclick="quickSend('今天天气怎么样？')">🌤 天气</button>
        <button class="btn" onclick="quickSend('帮我讲个故事')">📖 讲故事</button>
        <button class="btn" onclick="quickSend('今天的作业怎么写？')">📝 作业</button>
        <button class="btn" onclick="quickSend('给我出个数学题')">🔢 数学题</button>
        <button class="btn" onclick="quickSend('你还好吗？想你了')">❤️ 想你</button>
        <button class="btn" onclick="quickSend('放学了吗？什么时候回家？')">🏠 回家</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">💬</span>AI对话</div>
      <div class="chat-box" id="chatBox">
        <div class="msg system"><div class="bubble">输入问题，AI回答会自动发送到手表微聊 💬</div></div>
      </div>
      <div class="input-area">
        <textarea id="msgInput" placeholder="输入要发送的内容..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
        <button class="btn btn-primary" id="sendBtn" onclick="sendMsg()">发送</button>
      </div>
      <div style="margin-top:8px;display:flex;gap:8px">
        <button class="btn btn-green btn-sm" onclick="testSendToXtc()">🧪 测试发送</button>
        <button class="btn btn-orange btn-sm" onclick="openXtcApp()">📱 打开小天才</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">📋</span>手表回复</div>
      <div id="watchReplies" class="chat-box" style="min-height:60px;max-height:200px">
        <div class="msg system"><div class="bubble">等待手表端回复（通过通知栏监听）...</div></div>
      </div>
    </div>
  </div>

  <!-- Settings Tab -->
  <div class="tab-content" id="tab-settings">
    <div class="card">
      <div class="card-title"><span class="icon">🤖</span>AI模型配置</div>

      <div class="api-section">
        <div class="api-label"><span class="badge">主</span>本地部署 API</div>
        <div class="form-group">
          <label>API地址</label>
          <input id="p-url" placeholder="http://127.0.0.1:11434/v1">
        </div>
        <div class="form-group">
          <label>API Key（本地可能不需要）</label>
          <input id="p-key" type="password" placeholder="密码或留空">
        </div>
        <div class="form-group">
          <label>模型名称</label>
          <input id="p-model" placeholder="qwen2.5:7b">
        </div>
      </div>

      <div class="api-section">
        <div class="api-label"><span class="badge backup">备</span>Agnes API（备用）</div>
        <div class="form-group">
          <label>API地址</label>
          <input id="b-url" placeholder="https://api.agnes.ai/v1">
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input id="b-key" type="password" placeholder="sk-xxxx">
        </div>
        <div class="form-group">
          <label>模型名称</label>
          <input id="b-model" placeholder="gpt-4o-mini">
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">⚙️</span>发送设置</div>
      <div class="form-group">
        <label>手表端联系人名称</label>
        <input id="s-contact" placeholder="在小天才App里你的聊天对象名称">
      </div>
      <div class="form-group">
        <label>AI人设提示词</label>
        <textarea id="s-prompt" rows="3" placeholder="你是一个友好的AI助手..."></textarea>
      </div>
      <div class="form-group" style="display:flex;align-items:center;gap:8px">
        <input type="checkbox" id="s-autoreply" checked style="width:auto">
        <label for="s-autoreply" style="margin:0;font-size:13px">AI回答后自动发送到小天才微聊</label>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">🔗</span>权限与服务</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-outline btn-block" onclick="openAccessibility()">🔓 打开无障碍服务设置</button>
        <button class="btn btn-outline btn-block" onclick="openNotification()">🔔 打开通知监听设置</button>
        <button class="btn btn-outline btn-block" onclick="testAccessibility()">🔍 检测无障碍状态</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span class="icon">💾</span>操作</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary btn-sm" onclick="saveAllSettings()" style="flex:1">💾 保存设置</button>
        <button class="btn btn-red btn-sm" onclick="clearChat()" style="flex:1">🗑 清空对话</button>
      </div>
    </div>
  </div>

  <!-- Log Tab -->
  <div class="tab-content" id="tab-log">
    <div class="card">
      <div class="card-title"><span class="icon">📋</span>操作日志</div>
      <div class="log-box" id="logBox"></div>
      <div style="margin-top:8px">
        <button class="btn btn-outline btn-sm" onclick="clearLog()">🗑 清空日志</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== State =====
let chatHistory = [];
let settings = {};
let isProcessing = false;

// ===== Android Bridge (fallback for web preview) =====
const isAndroid = typeof XtcBridge !== 'undefined';
const bridge = isAndroid ? XtcBridge : {
  getSettings: () => localStorage.getItem('xtc_settings') || '{}',
  saveSettings: (s) => localStorage.setItem('xtc_settings', s),
  getApiConfig: (i) => localStorage.getItem('xtc_api_' + i) || '{}',
  sendMessageToXtc: (m) => { log('warn', '非Android环境，模拟发送: ' + m); return 'simulated'; },
  isAccessibilityEnabled: () => false,
  openAccessibilitySettings: () => log('warn', '非Android环境'),
  openNotificationSettings: () => log('warn', '非Android环境'),
  openXtcApp: () => log('warn', '非Android环境'),
  toast: (m) => showToast(m),
  getDeviceInfo: () => JSON.stringify({brand:'web',model:'browser',sdk:0,xtcInstalled:false,accessibilityEnabled:false}),
  setLastReply: (m) => {},
  getLastReply: () => ''
};

// ===== Init =====
window.addEventListener('DOMContentLoaded', () => {
  loadSettings();
  refreshStatus();
  setInterval(refreshStatus, 3000);
  setupTabs();
  setupInput();
  log('info', '应用已启动');
  log('info', '设备: ' + (isAndroid ? 'Android' : 'Web浏览器'));
});

function setupTabs() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });
}

function setupInput() {
  const input = document.getElementById('msgInput');
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 100) + 'px';
  });
}

// ===== Settings =====
function loadSettings() {
  try {
    const raw = bridge.getSettings();
    settings = typeof raw === 'string' ? JSON.parse(raw) : raw;
  } catch(e) { settings = {}; }

  if (!settings.primaryApi) settings.primaryApi = {
    name: '本地部署', baseUrl: 'http://127.0.0.1:11434/v1',
    apiKey: '', model: 'qwen2.5:7b'
  };
  if (!settings.backupApi) settings.backupApi = {
    name: 'Agnes API', baseUrl: 'https://api.agnes.ai/v1',
    apiKey: '', model: 'gpt-4o-mini'
  };
  if (!settings.contactName) settings.contactName = '宝贝';
  if (!settings.systemPrompt) settings.systemPrompt =
    '你是一个友好的AI助手，帮助回答手表佩戴者的问题。回答要简洁、适合儿童理解。';
  if (settings.autoReply === undefined) settings.autoReply = true;

  document.getElementById('p-url').value = settings.primaryApi.baseUrl || '';
  document.getElementById('p-key').value = settings.primaryApi.apiKey || '';
  document.getElementById('p-model').value = settings.primaryApi.model || '';
  document.getElementById('b-url').value = settings.backupApi.baseUrl || '';
  document.getElementById('b-key').value = settings.backupApi.apiKey || '';
  document.getElementById('b-model').value = settings.backupApi.model || '';
  document.getElementById('s-contact').value = settings.contactName || '';
  document.getElementById('s-prompt').value = settings.systemPrompt || '';
  document.getElementById('s-autoreply').checked = settings.autoReply !== false;

  log('info', '设置已加载');
}

function saveAllSettings() {
  settings.primaryApi.baseUrl = document.getElementById('p-url').value.trim();
  settings.primaryApi.apiKey = document.getElementById('p-key').value.trim();
  settings.primaryApi.model = document.getElementById('p-model').value.trim();
  settings.backupApi.baseUrl = document.getElementById('b-url').value.trim();
  settings.backupApi.apiKey = document.getElementById('b-key').value.trim();
  settings.backupApi.model = document.getElementById('b-model').value.trim();
  settings.contactName = document.getElementById('s-contact').value.trim();
  settings.systemPrompt = document.getElementById('s-prompt').value.trim();
  settings.autoReply = document.getElementById('s-autoreply').checked;

  bridge.saveSettings(JSON.stringify(settings));
  log('success', '✅ 设置已保存');
  showToast('设置已保存');
}

// ===== Chat =====
function quickSend(text) {
  document.getElementById('msgInput').value = text;
  sendMsg();
}

async function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || isProcessing) return;

  isProcessing = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addChat('user', text);
  log('info', '📤 用户: ' + text);

  const typingEl = addTyping();

  try {
    const reply = await callAI(text);
    removeTyping(typingEl);
    addChat('ai', reply);
    log('success', '🤖 AI: ' + reply.substring(0, 100) + (reply.length > 100 ? '...' : ''));

    if (settings.autoReply && isAndroid) {
      log('info', '📤 正在发送到小天才微聊...');
      const result = bridge.sendMessageToXtc(reply);
      if (result === 'success') {
        addChat('system', '✅ 已发送到手表微聊');
        log('success', '✅ 消息已发送到小天才微聊');
      } else {
        addChat('system', '❌ 发送失败: ' + result);
        log('error', '❌ 发送失败: ' + result);
      }
    } else if (!isAndroid) {
      addChat('system', '(非Android环境，未自动发送)');
    }
  } catch (err) {
    removeTyping(typingEl);
    addChat('system', '❌ AI调用失败: ' + err.message);
    log('error', '❌ AI调用失败: ' + err.message);

    log('warn', '⚠️ 主API失败，尝试备用API...');
    try {
      const backupReply = await callAIFromApi(text, 1);
      addChat('ai', backupReply);
      addChat('system', '✅ 已切换到备用API');
      log('success', '✅ 备用API回复成功');

      if (settings.autoReply && isAndroid) {
        bridge.sendMessageToXtc(backupReply);
      }
    } catch (backupErr) {
      addChat('system', '❌ 备用API也失败: ' + backupErr.message);
      log('error', '❌ 备用API也失败: ' + backupErr.message);
    }
  }

  isProcessing = false;
  document.getElementById('sendBtn').disabled = false;
}

async function callAI(text) {
  return await callAIFromApi(text, 0);
}

async function callAIFromApi(text, apiIndex) {
  const raw = bridge.getApiConfig(apiIndex);
  const config = typeof raw === 'string' ? JSON.parse(raw) : raw;

  const url = (config.baseUrl || '').replace(/\/+$/, '') + '/chat/completions';

  const messages = [
    { role: 'system', content: settings.systemPrompt || '你是一个友好的AI助手' }
  ];
  // Add recent chat history for context
  const recent = chatHistory.slice(-6);
  recent.forEach(m => {
    messages.push({
      role: m.type === 'user' ? 'user' : 'assistant',
      content: m.text
    });
  });
  messages.push({ role: 'user', content: text });

  log('info', '🌐 调用API: ' + (apiIndex === 0 ? '主' : '备') + ' → ' + url);

  const headers = { 'Content-Type': 'application/json' };
  if (config.apiKey) {
    headers['Authorization'] = 'Bearer ' + config.apiKey;
  }

  const resp = await fetch(url, {
    method: 'POST',
    headers: headers,
    body: JSON.stringify({
      model: config.model,
      messages: messages,
      max_tokens: 512,
      temperature: 0.7
    })
  });

  if (!resp.ok) {
    const errText = await resp.text().catch(() => '');
    throw new Error('HTTP ' + resp.status + ': ' + errText.substring(0, 200));
  }

  const data = await resp.json();
  if (data.choices && data.choices[0]) {
    return data.choices[0].message.content;
  }
  throw new Error('Unexpected response format');
}

// ===== Chat UI =====
function addChat(type, text) {
  const box = document.getElementById('chatBox');
  const avatar = type === 'user' ? '👨' : type === 'ai' ? '🤖' : 'ℹ️';
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.innerHTML = '<div class="avatar">' + avatar + '</div><div class="bubble">' + escapeHtml(text) + '</div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  chatHistory.push({ type, text });

  // Also save reply for notification listener
  if (type === 'ai' && isAndroid) {
    bridge.setLastReply(text);
  }
}

function addTyping() {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

function removeTyping(el) {
  if (el && el.parentNode) el.parentNode.removeChild(el);
}

function clearChat() {
  chatHistory = [];
  const box = document.getElementById('chatBox');
  box.innerHTML = '<div class="msg system"><div class="bubble">对话已清空 🗑</div></div>';
  log('info', '对话已清空');
}

// ===== Watch Replies =====
function addWatchReply(title, message) {
  const box = document.getElementById('watchReplies');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = '<div class="avatar">⌚</div><div class="bubble"><strong>' +
    escapeHtml(title) + '</strong><br>' + escapeHtml(message) + '</div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  log('info', '⌚ 手表回复: ' + title + ': ' + message);
}

// Listen for broadcast from notification service
window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'watch_reply') {
    addWatchReply(e.data.title, e.data.message);
  }
});

// ===== Status =====
function refreshStatus() {
  const info = JSON.parse(bridge.getDeviceInfo());

  setStatus('st-acc', info.accessibilityEnabled, '无障碍',
    info.accessibilityEnabled ? '已开启' : '未开启');
  setStatus('st-ntf', false, '通知', '检查中');
  setStatus('st-xtc', info.xtcInstalled, '小天才',
    info.xtcInstalled ? '已安装' : '未安装');
  setStatus('st-api', true, 'AI API', '就绪');
}

function setStatus(id, ok, label, text) {
  const el = document.getElementById(id);
  el.className = 'status-tag ' + (ok ? 'status-ok' : 'status-warn');
  el.innerHTML = '<span class="dot"></span>' + label + ': ' + text;
}

// ===== Actions =====
function openAccessibility() {
  bridge.openAccessibilitySettings();
  log('info', '打开无障碍服务设置');
}

function openNotification() {
  bridge.openNotificationSettings();
  log('info', '打开通知监听设置');
}

function testAccessibility() {
  const enabled = bridge.isAccessibilityEnabled();
  showToast(enabled ? '✅ 无障碍服务已开启' : '❌ 无障碍服务未开启');
  log(enabled ? 'success' : 'warn', '无障碍服务状态: ' + (enabled ? '已开启' : '未开启'));
  refreshStatus();
}

function openXtcApp() {
  bridge.openXtcApp();
  log('info', '正在打开小天才App');
}

function testSendToXtc() {
  const testMsg = '你好，这是AI助手的测试消息~';
  log('info', '🧪 测试发送: ' + testMsg);
  const result = bridge.sendMessageToXtc(testMsg);
  if (result === 'success') {
    showToast('✅ 测试消息发送成功');
    log('success', '✅ 测试发送成功');
  } else {
    showToast('❌ 测试失败: ' + result);
    log('error', '❌ 测试失败: ' + result);
  }
}

// ===== Logging =====
function log(level, msg) {
  const box = document.getElementById('logBox');
  const now = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = 'log-line ' + level;
  div.textContent = '[' + now + '] ' + msg;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  // Keep only last 200 lines
  while (box.children.length > 200) box.removeChild(box.firstChild);
}

function clearLog() {
  document.getElementById('logBox').innerHTML = '';
  log('info', '日志已清空');
}

// ===== Utilities =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
