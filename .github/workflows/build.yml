name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java 17
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip
          java -version

      - name: Install Gradle 8.5
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          sudo mv gradle-8.5 /opt/gradle
          sudo ln -sf /opt/gradle/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Install Android SDK
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo mv cmdline-tools /opt/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV
          export ANDROID_HOME=/opt/android-sdk
          export PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools
          yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Copy web to assets
        run: |
          mkdir -p android/app/src/main/assets/web
          cp web/index.html android/app/src/main/assets/web/index.html

      - name: Build Debug APK
        working-directory: android
        env:
          ANDROID_HOME: /opt/android-sdk
          PATH: /opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          echo "sdk.dir=/opt/android-sdk" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          ls -la android/app/build/outputs/apk/debug/
          file android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XTC-AI-Assistant-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
